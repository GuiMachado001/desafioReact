services:
  db:
    image: postgres:15
    container_name: postgres_desafio
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin # Coloque uma senha fácil
      POSTGRES_DB: desafio_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: